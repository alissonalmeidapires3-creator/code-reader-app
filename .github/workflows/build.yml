name: Android CI Compilation Pipeline
on:
  push:
    branches: [ "principal", "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    - name: Configure Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'
    - name: Mudar para a Pasta do Projeto e Compilar
      run: |
        cd CodeReader || true
        chmod +x gradlew || true
        ./gradlew assembleDebug
    - name: Export Output APK
      uses: actions/upload-artifact@v4
      with:
        name: Build-Output-APK
        path: |
          CodeReader/app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/app-debug.apk
