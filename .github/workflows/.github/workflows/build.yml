name: Android CI Compilation Pipeline
on:
  push:
    branches: [ "copilot/projeto-leitor-de-código-completo", "principal", "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    - name: Configure Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'
    - name: Set Permission
      run: chmod +x gradlew || true
    - name: Compile and Assemble APK
      run: ./gradlew assembleDebug
    - name: Export Output APK
      uses: actions/upload-artifact@v4
      with:
        name: Build-Output-APK
        path: app/build/outputs/apk/debug/app-debug.apk
